name: Apartment Checker Bot

on:
  schedule:
    - cron: '0 */6 * * *'  # Her 6 saatte bir çalıştırır
  workflow_dispatch:       # İstediğiniz zaman manuel çalıştırma butonu ekler

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # known_rooms.txt dosyasını repoya geri kaydedebilmesi için gerekli izin

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Playwright ve Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Botu Çalıştır
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python main.py

      - name: Hafızayı GitHub'a Kaydet (Commit)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add known_rooms.txt
          git commit -m "Hafiza guncellendi (Yeni odalar)" || echo "Degisiklik yok"
          git push
